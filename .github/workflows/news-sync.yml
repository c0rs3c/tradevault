name: News Sync

on:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call deployed news sync route
        env:
          NEWS_SYNC_URL: ${{ secrets.NEWS_SYNC_URL }}
          NEWS_SYNC_CRON_SECRET: ${{ secrets.NEWS_SYNC_CRON_SECRET }}
        run: |
          test -n "$NEWS_SYNC_URL"
          test -n "$NEWS_SYNC_CRON_SECRET"
          curl --fail --show-error --silent \
            -X POST \
            -H "x-news-sync-secret: $NEWS_SYNC_CRON_SECRET" \
            "$NEWS_SYNC_URL"
